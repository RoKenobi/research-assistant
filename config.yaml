vault_path: "C:/Coding projects/myGithub/Vault"
# Topic folders go under <vault>/<research_folder>/<topic-slug>/
research_folder: "Research"

# Your lab's setup. Ranks matching work higher and shapes feasibility notes;
# work on other robots or simulators is still read.
lab:
  robots: ["Unitree G1", "AgiBot X2"]
  simulators: ["MuJoCo"]

# Run through `claude -p` on your Claude plan.
models:
  fast: claude-sonnet-5-5   # search queries, ranking, repo filtering
  deep: claude-opus-5-5     # reader, ideas, critic
effort:
  fast: low
  deep: high

# arXiv query clause ANDed onto every search; "" searches all fields.
arxiv_category_filter: "(cat:cs.RO OR cat:cs.LG OR cat:cs.AI OR cat:cs.CV)"
arxiv_results_per_query: 8

# Per-run caps keep one run inside your plan's usage limits.
max_new_papers: 15      # total, including follow-ups (inbox papers are extra)
followup_papers: 5      # reserved for the critic's targeted searches
max_critic_rounds: 2
max_repos: 10

# Characters of each paper body sent to the reader (LaTeX preamble and
# bibliography are stripped first).
paper_char_budget: 40000
llm_concurrency: 2      # papers read at the same time
llm_timeout_sec: 600
